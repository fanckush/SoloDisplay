# git-cliff configuration. Regenerate the changelog with `git cliff -o CHANGELOG.md`.
# The release workflow uses the same config for GitHub Release notes.

[changelog]
header = """
# Changelog

All notable changes to SoloDisplay are listed here. Versions follow semantic versioning and are
calculated from Conventional Commits by `scripts/next_version.py`.
"""
body = """
{%- macro remote_url() -%}
  https://github.com/fanckush/SoloDisplay
{%- endmacro %}
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}]({{ self::remote_url() }}/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else -%}
## Unreleased
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}\
{% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | split(pat="\n") | first | trim | upper_first }} \
([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
{%- if previous.version %}
**Full diff:** {{ self::remote_url() }}/compare/{{ previous.version }}...{{ version | default(value="HEAD") }}
{% endif %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
# Dependabot merge commits and the like are noise in a changelog.
filter_commits = true
protect_breaking_commits = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
# Some subjects were wrapped onto a second line without a blank line after them, which the
# conventional commit parser rejects. Join them back into one subject.
commit_preprocessors = [
  { pattern = '^([^\n]+)\n([^\n])', replace = "$1 $2" },
]
# The HTML comments order the sections and are stripped from the headings.
commit_parsers = [
  { message = "^Merge ", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^(docs|chore)", skip = true },
]
