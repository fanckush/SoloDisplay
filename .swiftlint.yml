# SwiftLint configuration for Lidless.
excluded:
  - .build
  - DerivedData
  - build

disabled_rules:
  - todo
  - line_length          # governed by SwiftFormat --maxwidth

opt_in_rules:
  - empty_count
  - closure_spacing
  - explicit_init

identifier_name:
  min_length: 2

cyclomatic_complexity:
  warning: 20
  error: 40
  ignores_case_statements: true

file_length:
  warning: 650
  error: 1000
  ignore_comment_only_lines: true

function_body_length:
  warning: 130
  error: 300

type_body_length:
  warning: 525
  error: 700
