name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without leading v), e.g. 0.1.0"
        required: true

permissions:
  contents: write        # create the GitHub Release
  id-token: write        # build provenance attestation
  attestations: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Import Developer ID certificate
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Write App Store Connect API key
        env:
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
        run: |
          echo "$AC_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/ac_api_key.p8"

      - name: Build, sign, notarize, package
        env:
          VERSION: ${{ steps.v.outputs.version }}
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_PATH: ${{ runner.temp }}/ac_api_key.p8
        run: scripts/build-release.sh

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: build/dist/Lidless-*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Lidless ${{ steps.v.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.v.outputs.version, '-') }}
          files: |
            build/dist/Lidless-*.zip
            build/dist/Lidless-*.zip.sha256
            build/dist/Lidless-*.dmg
            build/dist/Lidless-*.dmg.sha256

      - name: Bump Homebrew cask
        if: ${{ !contains(steps.v.outputs.version, '-') }}
        env:
          GH_TOKEN: ${{ secrets.TAP_REPO_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          SHA=$(cut -d' ' -f1 build/dist/Lidless-$VERSION.zip.sha256)
          gh workflow run bump.yml \
            --repo fanckush/homebrew-lidless \
            -f version="$VERSION" -f sha256="$SHA" || \
          echo "Tap bump dispatch skipped (configure fanckush/homebrew-lidless + TAP_REPO_TOKEN)."
