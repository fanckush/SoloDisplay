name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  resolve:
    name: Resolve release
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      target_sha: ${{ steps.release.outputs.target_sha }}
      mode: ${{ steps.release.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate selected commit
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_REF: ${{ github.ref }}
          SELECTED_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$SELECTED_REF" == "refs/heads/main" ]] || {
              echo "Run releases from the main branch." >&2
              exit 1
            }
            TARGET_SHA=$(git rev-parse HEAD)
            [[ "$TARGET_SHA" == "$(git rev-parse origin/main)" ]] || {
              echo "main advanced after this run was selected; start a fresh release run." >&2
              exit 1
            }
          else
            [[ "$SELECTED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
              echo "Release tags must use stable vMAJOR.MINOR.PATCH syntax." >&2
              exit 1
            }
            TARGET_SHA=$(git rev-list -n 1 "$SELECTED_REF")
            git merge-base --is-ancestor "$TARGET_SHA" origin/main || {
              echo "The release tag must point to a commit reachable from main." >&2
              exit 1
            }
          fi
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Calculate semantic version
        id: calculate
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        run: python3 scripts/next_version.py --head "$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Select release or no-op
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_TAG: ${{ github.ref_name }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
          CURRENT_TAG: ${{ steps.calculate.outputs.current_tag }}
          NEXT_TAG: ${{ steps.calculate.outputs.next_tag }}
          NEXT_VERSION: ${{ steps.calculate.outputs.next_version }}
          BUMP: ${{ steps.calculate.outputs.bump }}
          COMMIT_COUNT: ${{ steps.calculate.outputs.commit_count }}
          UNKNOWN_COUNT: ${{ steps.calculate.outputs.unknown_count }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHOULD_RELEASE=true
          MODE=new
          if [[ "$EVENT_NAME" == "push" ]]; then
            TAG="$SELECTED_TAG"
            VERSION="${SELECTED_TAG#v}"
            MODE=tag
          elif [[ -n "$NEXT_TAG" ]]; then
            TAG="$NEXT_TAG"
            VERSION="$NEXT_VERSION"
          elif [[ -n "$CURRENT_TAG" && "$(git rev-list -n 1 "$CURRENT_TAG")" == "$TARGET_SHA" ]]; then
            VERSION="${CURRENT_TAG#v}"
            REQUIRED=(
              "SoloDisplay-$VERSION.zip"
              "SoloDisplay-$VERSION.zip.sha256"
              "SoloDisplay-$VERSION.dmg"
              "SoloDisplay-$VERSION.dmg.sha256"
            )
            RELEASE_EXISTS=false
            if ASSETS=$(gh release view "$CURRENT_TAG" --json assets --jq '.assets[].name' 2>/dev/null); then
              RELEASE_EXISTS=true
            fi
            COMPLETE=true
            for asset in "${REQUIRED[@]}"; do
              grep -Fxq "$asset" <<< "$ASSETS" || COMPLETE=false
            done
            if [[ "$COMPLETE" == "true" ]]; then
              SHOULD_RELEASE=false
              TAG=""
              VERSION=""
              MODE=noop
            else
              TAG="$CURRENT_TAG"
              if [[ "$RELEASE_EXISTS" == "true" ]]; then
                MODE=repair
              else
                MODE=recover
              fi
            fi
          else
            SHOULD_RELEASE=false
            TAG=""
            VERSION=""
            MODE=noop
          fi

          {
            echo "should_release=$SHOULD_RELEASE"
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "target_sha=$TARGET_SHA"
            echo "mode=$MODE"
          } >> "$GITHUB_OUTPUT"

          if [[ "$SHOULD_RELEASE" == "true" ]]; then
            echo "### Release $TAG" >> "$GITHUB_STEP_SUMMARY"
            echo "Mode: $MODE; target: \`$TARGET_SHA\`; bump: ${BUMP:-explicit tag}." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### No release created" >> "$GITHUB_STEP_SUMMARY"
            echo "${COMMIT_COUNT:-0} commits were inspected; no feat, fix, perf, or breaking change requires a new release." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "${UNKNOWN_COUNT:-0}" != "0" ]]; then
            echo "$UNKNOWN_COUNT commit subjects were not conventional and did not affect the version." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  verify:
    name: Verify release
    needs: resolve
    if: ${{ needs.resolve.outputs.should_release == 'true' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.target_sha }}
      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Test Swift package
        run: swift test
      - name: Install xcbeautify
        run: brew install xcbeautify
      - name: Test app
        run: |
          set -o pipefail
          xcodebuild \
            -project SoloDisplay.xcodeproj \
            -scheme SoloDisplay \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            test -only-testing:SoloDisplayTests | xcbeautify
        shell: bash

  release:
    name: Sign and publish
    needs: [resolve, verify]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.target_sha }}

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Import Developer ID certificate
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Write App Store Connect API key
        env:
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
        run: echo "$AC_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/ac_api_key.p8"

      - name: Build, sign, notarize, package
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_PATH: ${{ runner.temp }}/ac_api_key.p8
        run: scripts/build-release.sh

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: build/dist/SoloDisplay-*.zip

      - name: Create or repair GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: SoloDisplay ${{ needs.resolve.outputs.version }}
          tag_name: ${{ needs.resolve.outputs.tag }}
          target_commitish: ${{ needs.resolve.outputs.target_sha }}
          generate_release_notes: ${{ needs.resolve.outputs.mode != 'repair' }}
          prerelease: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            build/dist/SoloDisplay-*.zip
            build/dist/SoloDisplay-*.zip.sha256
            build/dist/SoloDisplay-*.dmg
            build/dist/SoloDisplay-*.dmg.sha256

      - name: Bump Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.TAP_REPO_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          SHA=$(cut -d' ' -f1 "build/dist/SoloDisplay-$VERSION.zip.sha256")
          gh workflow run bump.yml \
            --repo fanckush/homebrew-solodisplay \
            -f version="$VERSION" -f sha256="$SHA"
