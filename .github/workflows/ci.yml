name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package-tests:
    name: Swift package tests
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Show toolchain
        run: swift --version && xcodebuild -version
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          # The module cache stores the absolute workspace path, which is derived from the
          # repository name. A cache from a differently named repo restores and then fails
          # the build, so the name is part of the key and of the restore prefix.
          key: spm-${{ matrix.os }}-${{ github.event.repository.name }}-${{ hashFiles('Package.swift') }}
          restore-keys: spm-${{ matrix.os }}-${{ github.event.repository.name }}-
      - name: Build
        run: swift build
      - name: Test
        run: swift test --enable-code-coverage
      # Codecov cannot parse SwiftPM's llvm.coverage.json.export: it accepts the upload, then
      # reports the commit as errored with zero files. lcov is read correctly.
      - name: Export coverage as lcov
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          bin=$(swift build --show-bin-path)
          bundle=$(ls -d "$bin"/*.xctest | head -1)
          xcrun llvm-cov export -format=lcov \
            "$bundle/Contents/MacOS/$(basename "$bundle" .xctest)" \
            -instr-profile "$bin/codecov/default.profdata" > package.lcov
          grep -c '^SF:' package.lcov
      - name: Upload package coverage
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v5
        with:
          disable_search: true
          fail_ci_if_error: true
          files: package.lcov
          flags: package-tests
          name: package-tests
          use_oidc: true

  app-tests:
    name: App unit tests (unsigned)
    runs-on: macos-26
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Install xcbeautify
        run: brew install xcbeautify
      # Account-independent build: ad-hoc signing, no team, unit tests only.
      # The UI test target is intentionally skipped (needs interactive automation).
      - name: Build & test app
        run: |
          set -o pipefail
          xcodebuild \
            -project SoloDisplay.xcodeproj \
            -scheme SoloDisplay \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            -enableCodeCoverage YES \
            test -only-testing:SoloDisplayTests | xcbeautify
        shell: bash
      # Xcode puts the app's own code in SoloDisplay.debug.dylib and leaves
      # Contents/MacOS/SoloDisplay as a launcher stub with no coverage mapping. Codecov's Swift
      # processor looks at the stub, finds nothing, and reports zero.
      - name: Export coverage as lcov
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          products=DerivedData/Build/Products/Debug
          profdata=$(find DerivedData/Build/ProfileData -name '*.profdata' | head -1)
          binary="$products/SoloDisplay.app/Contents/MacOS/SoloDisplay.debug.dylib"
          [ -f "$binary" ] || binary="$products/SoloDisplay.app/Contents/MacOS/SoloDisplay"
          xcrun llvm-cov export -format=lcov "$binary" \
            -object "$products/SoloDisplay.app/Contents/PlugIns/SoloDisplayTests.xctest/Contents/MacOS/SoloDisplayTests" \
            -instr-profile "$profdata" > app.lcov
          grep -c '^SF:' app.lcov
      - name: Upload app coverage
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v5
        with:
          disable_search: true
          fail_ci_if_error: true
          files: app.lcov
          flags: app-tests
          name: app-tests
          use_oidc: true

  lint:
    name: Lint (non-blocking)
    runs-on: macos-26
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: SwiftFormat (lint)
        run: |
          brew install swiftformat
          swiftformat --lint .
      - name: SwiftLint
        run: |
          brew install swiftlint
          swiftlint --strict
