name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package-tests:
    name: Swift package tests
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Show toolchain
        run: swift --version && xcodebuild -version
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          # The module cache stores the absolute workspace path, which is derived from the
          # repository name. A cache from a differently named repo restores and then fails
          # the build, so the name is part of the key and of the restore prefix.
          key: spm-${{ matrix.os }}-${{ github.event.repository.name }}-${{ hashFiles('Package.swift') }}
          restore-keys: spm-${{ matrix.os }}-${{ github.event.repository.name }}-
      - name: Build
        run: swift build
      - name: Test
        run: swift test --enable-code-coverage
      - name: Locate coverage report
        if: github.event_name == 'push'
        id: coverage
        run: echo "path=$(swift test --show-codecov-path)" >> "$GITHUB_OUTPUT"
      - name: Upload package coverage
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v5
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ${{ steps.coverage.outputs.path }}
          flags: package-tests
          name: package-tests
          use_oidc: true

  app-tests:
    name: App unit tests (unsigned)
    runs-on: macos-26
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Install xcbeautify
        run: brew install xcbeautify
      # Account-independent build: ad-hoc signing, no team, unit tests only.
      # The UI test target is intentionally skipped (needs interactive automation).
      # Keep Xcode's default DerivedData location so Codecov can find its profdata.
      - name: Build & test app
        run: |
          set -o pipefail
          xcodebuild \
            -project SoloDisplay.xcodeproj \
            -scheme SoloDisplay \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            -enableCodeCoverage YES \
            test -only-testing:SoloDisplayTests | xcbeautify
        shell: bash
      - name: Upload app coverage
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: true
          flags: app-tests
          name: app-tests
          swift_project: SoloDisplay
          use_oidc: true

  lint:
    name: Lint (non-blocking)
    runs-on: macos-26
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: SwiftFormat (lint)
        run: |
          brew install swiftformat
          swiftformat --lint .
      - name: SwiftLint
        run: |
          brew install swiftlint
          swiftlint --strict
